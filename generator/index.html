<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Personal Soundtrack Generator</title><style>:root{--bg:#f5f2ed;--card:#fff;--ink:#211c21;--muted:#777178;--line:#ddd6d0;--accent:#9b286e;--soft:#f0ece8}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:1180px;margin:0 auto;padding:34px 22px 70px}h1{font-size:42px;line-height:1.08;margin:0 0 8px}h2{margin:0 0 14px;font-size:24px}.sub{color:var(--muted);font-size:17px}.status{margin:22px 0;padding:13px 16px;border-radius:12px;background:#efede9;color:#276947}.tabs{display:flex;gap:8px;margin:24px 0}.tab{border:1px solid var(--line);background:#fff;color:var(--ink);padding:11px 18px;border-radius:999px;cursor:pointer;font-size:15px}.tab.active{background:var(--ink);color:#fff}.mode{display:none}.mode.active{display:block}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 5px 24px #00000008;margin-bottom:18px}.field{margin:12px 0}.field label{display:block;font-weight:650;margin:0 0 6px}select,input[type=text],input[type=url]{width:100%;padding:11px 12px;border:1px solid #cbc4bf;border-radius:10px;background:#fff;font:inherit}button.primary{border:0;border-radius:11px;background:var(--ink);color:#fff;padding:13px 20px;font-size:16px;cursor:pointer}button.primary:disabled{opacity:.5;cursor:wait}.equalizer{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 14px}.slider label{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:3px}.slider input{width:100%;accent-color:var(--accent)}.small{color:var(--muted);font-size:14px}.error{color:#9b1c31;background:#fff0f2;border-radius:12px;padding:14px;white-space:pre-wrap}.visual-card{margin-top:18px}.visual-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:12px}.visual-note{font-size:13px;color:var(--muted)}.portrait-row{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:12px;align-items:end}.file-input{font-size:13px;color:var(--muted);width:100%}.gallery-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}.visual-slot{border:1px solid var(--line);border-radius:12px;padding:10px;background:#faf8f5}.visual-slot label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.visual-slot input[type=url]{font-size:13px;padding:8px}.visual-slot input[type=file]{width:100%;font-size:11px;margin-top:6px}.portrait-preview{width:100%;aspect-ratio:3/4;border-radius:14px;overflow:hidden;background:var(--soft);margin-top:12px}.portrait-preview img{width:100%;height:100%;object-fit:cover}.visual-output{margin-top:18px}.visual-output .portrait-preview{max-width:230px}.visual-output-gallery{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:12px}.story-meta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:18px 0}.meta-box{background:var(--soft);border-radius:13px;padding:12px}.meta-label{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.meta-value{font-size:17px;font-weight:700;margin-top:4px}.hero-track{padding:18px 0 4px}.hero-track .song{font-size:28px}.story-lead{font-size:17px;line-height:1.7;margin:8px 0 18px}.result-divider{border-top:1px solid var(--line);margin:18px 0 0}@media(max-width:850px){.grid{grid-template-columns:1fr}.equalizer{grid-template-columns:repeat(2,minmax(0,1fr))}.story-meta{grid-template-columns:repeat(2,minmax(0,1fr))}h1{font-size:32px}}@media(max-width:620px){.gallery-grid,.visual-output-gallery{grid-template-columns:1fr}.portrait-row{grid-template-columns:1fr}.equalizer{grid-template-columns:1fr}.story-meta{grid-template-columns:1fr}}</style></head><body><main><h1>🎧 Personal Soundtrack Generator</h1><div class="sub">Ваш персонаж, его история и эмоциональный профиль превращаются в один главный саундтрек.</div><div id="status" class="status">Загружаю библиотеку…</div><div class="tabs"><button class="tab active" data-mode="single">Один персонаж</button></div><section id="single" class="mode active"><div class="grid"><section class="card"><h2>Персонаж</h2><div class="field"><label>Имя</label><input id="s-name" type="text" placeholder="Например, Марисабель"></div><div class="field"><label>Раса</label><select id="s-race"></select></div><div class="field"><label>Роль</label><select id="s-role"></select></div><div class="field"><label>Сфера жизни</label><select id="s-sphere"></select></div><div class="field"><label>Отправная точка</label><select id="s-start"></select></div><div class="field"><label>Текущая линия</label><select id="s-current"></select></div><div class="field"><label>Возможное будущее</label><select id="s-future"></select></div></section><section class="card"><h2>Эмоциональный эквалайзер</h2><div id="single-eq" class="equalizer"></div></section></div><div id="single-visual"></div><button id="single-run" class="primary" disabled>Сгенерировать саундтрек</button><div id="single-out"></div></section></main><script src="../js/soundtrack-engine.js"></script><script src="app.js"></script></body></html>
