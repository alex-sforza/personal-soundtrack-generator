<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Soundtrack Engine — Test Lab</title>
<style>
body{font-family:system-ui,sans-serif;max-width:1120px;margin:0 auto;padding:32px;background:#f5f2ed;color:#241f24}h1{margin-bottom:4px}.sub{opacity:.65}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px;margin:24px 0}.card{background:#fff;border:1px solid #ddd6d0;border-radius:16px;padding:20px;box-shadow:0 4px 18px #0000000b}label{display:block;margin:10px 0 4px;font-weight:600}select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:9px;background:#fff}button{border:0;border-radius:10px;padding:11px 16px;background:#241f24;color:#fff;cursor:pointer;margin-top:12px}.result{padding:13px 0;border-bottom:1px solid #eee}.score{font-size:.85em;opacity:.65;margin-top:3px}.error{color:#9b1c31;background:#fff0f2;padding:12px;border-radius:10px;margin-top:16px;white-space:pre-wrap}.status{padding:12px;border-radius:10px;background:#f0eee9;margin-top:12px;font-size:.92em}.ok{color:#356b43}.warn{color:#8a5b16}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#eee;margin:3px;font-size:.82em}.profile{line-height:1.8}.meta{font-size:.85em;opacity:.65;margin-top:6px}.note{padding:12px;background:#faf8f4;border-radius:10px;margin-top:12px}.diag{font-family:ui-monospace,monospace;font-size:.85em;line-height:1.6;margin-top:10px}
</style>
</head>
<body>
<h1>🎧 Soundtrack Engine Test Lab</h1>
<div class="sub">Внутренняя страница для калибровки алгоритма. Ничего не меняет в основном генераторе.</div>
<div id="status" class="status">Запуск тестовой лаборатории…</div>
<div class="grid">
<section class="card"><h2>Один персонаж</h2><label>Тестовый сценарий</label><select id="singleCase" disabled></select><button id="singleBtn" disabled>Запустить тест</button><div id="singleOut"></div></section>
<section class="card"><h2>Два персонажа</h2><label>Тестовый сценарий</label><select id="pairCase" disabled></select><label>Фокус</label><select id="focus"><option value="connection">Они сами</option><option value="bond" selected>Их связь</option><option value="events">То, что с ними происходит</option><option value="conflict">Их конфликт</option></select><button id="pairBtn" disabled>Запустить тест</button><div id="pairOut"></div></section>
</div>
<div class="card"><h2>Профиль, который получил алгоритм</h2><p class="meta">Смотрим, какие параметры реально дошли до движка.</p><div id="profileOut">Запустите любой тест.</div></div>

<script>
window.__engineLoaded=false;
window.__showFatal=function(message){var el=document.getElementById('status');if(el)el.innerHTML='<span class="warn">⚠ '+String(message).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})+'</span>';};
window.addEventListener('error',function(e){if(!window.__engineLoaded && e.filename)window.__showFatal('Ошибка JavaScript при загрузке движка: '+e.message+' · '+e.filename);});
</script>
<script src="../js/soundtrack-engine.js" onload="window.__engineLoaded=true" onerror="window.__showFatal('Не удалось загрузить ../js/soundtrack-engine.js')"></script>
<script>
(function(){
'use strict';
var singleEl=document.getElementById('singleCase'),pairEl=document.getElementById('pairCase'),statusEl=document.getElementById('status');
var SOURCE_FILES=['alternative','gothic-industrial','modern-heavy','female-alternative','classic-rock','russian-rock','dark-folk','soundtracks','anime','metal-rock'];
var data=null,music=[],scoring=null;
function esc(s){return String(s==null?'':s).replace(/[&<>\"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]||c;});}
function getJson(url){return fetch(url,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error(r.status+' '+url);return r.json();});}
function fail(msg){statusEl.innerHTML='<span class="warn">⚠ '+esc(msg)+'</span>';}
function load(){
 if(!window.SoundtrackEngine){fail('Движок не исполнился. Проверьте файл ../js/soundtrack-engine.js.');return;}
 statusEl.textContent='✓ Движок загружен · загружаю test-cases.json…';
 getJson('./test-cases.json').then(function(tc){data=tc;statusEl.textContent='✓ test-cases.json загружен · загружаю music-scoring.json…';return getJson('../data/music-scoring.json');}).then(function(sc){scoring=sc;statusEl.textContent='✓ scoring загружен · загружаю 10 музыкальных слоёв…';return Promise.all(SOURCE_FILES.map(function(category){return getJson('../data/music/'+category+'.json').then(function(raw){return (raw.tracks||[]).map(function(t){return Object.assign({},t,{category:category,layer:category});});}).catch(function(e){throw new Error('Слой '+category+' не загрузился: '+e.message);});}));}).then(function(groups){music=[].concat.apply([],groups);data.cases.filter(function(x){return x.type==='single';}).forEach(function(x,i){singleEl.add(new Option(x.description||x.id,i));});data.cases.filter(function(x){return x.type==='pair';}).forEach(function(x,i){pairEl.add(new Option(x.description||x.id,i));});singleEl.disabled=false;pairEl.disabled=false;document.getElementById('singleBtn').disabled=false;document.getElementById('pairBtn').disabled=false;statusEl.innerHTML='<span class="ok">✓ Загружено '+music.length+' треков · '+SOURCE_FILES.length+' музыкальных слоёв · '+data.cases.length+' тестов · движок подключён</span>';}).catch(function(e){console.error(e);fail(e.stack||e.message);});
}
var signalMap={gothic:['darkness','mystery','loneliness'],melancholy:['melancholy','loneliness','nostalgia'],danger:['danger','drama'],beast:['danger','power','chaos'],dark:['darkness','danger'],energy:['energy','rebellion'],night:['mystery','darkness'],identity:['drama','loneliness','mystery'],water:['mystery','melancholy','freedom'],mystical:['mystery','darkness'],outsider:['loneliness','freedom'],freedom:['freedom','energy'],'new-life':['hope','freedom'],spirits:['mystery','darkness'],memory:['nostalgia','melancholy'],investigation:['mystery','drama'],loss:['melancholy','loneliness','drama'],mystery:['mystery','darkness'],nostalgia:['nostalgia','melancholy'],conflict:['drama','danger'],friendship:['hope','tenderness','nostalgia'],trust:['hope','tenderness'],warmth:['tenderness','hope'],loyalty:['tenderness','hope'],tension:['drama','danger'],attraction:['romance','danger'],dependence:['romance','loneliness'],chaos:['chaos','energy'],tenderness:['tenderness','romance'],hope:['hope','energy'],family:['tenderness','nostalgia']};
function sliders(signals){var p={drama:5,romance:3,danger:5,mystery:5,hope:4,loneliness:5,nostalgia:5,chaos:5,power:5,freedom:5,melancholy:5,tenderness:4,rebellion:5,darkness:5,epic:4,energy:5};(signals||[]).forEach(function(s){(signalMap[s]||[]).forEach(function(k){p[k]=Math.min(10,p[k]+2);});});return p;}
function character(c,part){var p=sliders(c.expectedSignals||[]);return {sliders:p,storyProfile:p,role:part?'character-b':'character-a'};}
function pairCharacters(c){var all=c.expectedSignals||[],mid=Math.ceil(all.length/2),a=character({expectedSignals:all.slice(0,mid)},0),b=character({expectedSignals:all.slice(mid)},1);if(c.id==='siblings'){a.sliders.nostalgia=9;a.sliders.tenderness=8;b.sliders.nostalgia=8;b.sliders.tenderness=7;b.sliders.drama=7;}if(c.id==='enemies-to-allies'){a.sliders.danger=9;a.sliders.power=8;b.sliders.danger=8;b.sliders.hope=7;b.sliders.mystery=7;}if(c.id==='friendship'){a.sliders.hope=9;a.sliders.tenderness=8;b.sliders.hope=8;b.sliders.tenderness=9;}if(c.id==='romantic-chaos'){a.sliders.romance=9;a.sliders.chaos=8;b.sliders.romance=9;b.sliders.chaos=9;b.sliders.tenderness=7;}return [a,b];}
function render(items){return items.map(function(x,i){return '<div class="result"><b>'+ (i+1)+'. '+esc(x.title||'Без названия')+'</b> — '+esc(x.artist||'Неизвестный исполнитель')+'<div class="score">Итоговый score: '+Number(x.finalScore==null?x.score:x.finalScore).toFixed(2)+'</div><div class="meta">Категория: '+esc(x.category||'—')+'</div></div>';}).join('');}
function showProfile(p,label){document.getElementById('profileOut').innerHTML='<div class="note"><b>'+esc(label)+'</b></div><div class="profile">'+Object.keys(p).map(function(k){return '<span class="pill">'+esc(k)+' '+Number(p[k]).toFixed(1)+'</span>';}).join('')+'</div>';}
document.getElementById('singleBtn').onclick=function(){try{var c=data.cases.filter(function(x){return x.type==='single';})[singleEl.value],r=SoundtrackEngine.generatePersonalSoundtrack(character(c,0),music,scoring,{limit:5});document.getElementById('singleOut').innerHTML='<h3>Результат</h3>'+render(r.tracks);showProfile(r.targetProfile,'Профиль персонажа: '+c.id);}catch(e){document.getElementById('singleOut').innerHTML='<div class="error">'+esc(e.stack||e.message)+'</div>';}};
document.getElementById('pairBtn').onclick=function(){try{var c=data.cases.filter(function(x){return x.type==='pair';})[pairEl.value],ab=pairCharacters(c),r=SoundtrackEngine.generateSharedSoundtrack(ab[0],ab[1],music,scoring,{relationshipType:c.relationship,trajectory:c.trajectory,focus:document.getElementById('focus').value,limit:5});document.getElementById('pairOut').innerHTML='<h3>Результат</h3>'+render(r.tracks)+'<div class="meta">Связь: '+esc(r.relationshipType||'—')+' · траектория: '+esc(r.trajectory||'—')+'</div>';showProfile(r.targetProfile,'Общий профиль: '+c.id);}catch(e){document.getElementById('pairOut').innerHTML='<div class="error">'+esc(e.stack||e.message)+'</div>';}};
load();
})();
</script>
</body></html>
