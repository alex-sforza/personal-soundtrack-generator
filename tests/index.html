<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Soundtrack Engine — Test Lab</title>
<style>
body{font-family:system-ui,sans-serif;max-width:1120px;margin:0 auto;padding:32px;background:#f5f2ed;color:#241f24}h1{margin-bottom:4px}.sub{opacity:.65}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:18px;margin:24px 0}.card{background:white;border:1px solid #ddd6d0;border-radius:16px;padding:20px;box-shadow:0 4px 18px #0000000b}label{display:block;margin:10px 0 4px;font-weight:600}select{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:9px;background:#fff}button{border:0;border-radius:10px;padding:11px 16px;background:#241f24;color:white;cursor:pointer;margin-top:12px}.result{padding:13px 0;border-bottom:1px solid #eee}.score{font-size:.85em;opacity:.65;margin-top:3px}.error{color:#9b1c31;background:#fff0f2;padding:12px;border-radius:10px;margin-top:16px;white-space:pre-wrap}.status{padding:10px;border-radius:10px;background:#f0eee9;margin-top:12px;font-size:.9em}.ok{color:#356b43}.warn{color:#8a5b16}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#eee;margin:3px;font-size:.82em}.profile{line-height:1.8}.meta{font-size:.85em;opacity:.65;margin-top:6px}.note{padding:12px;background:#faf8f4;border-radius:10px;margin-top:12px}
</style>
</head>
<body>
<h1>🎧 Soundtrack Engine Test Lab</h1>
<div class="sub">Внутренняя страница для калибровки алгоритма. Ничего не меняет в основном генераторе.</div>
<div id="status" class="status">Загрузка базы…</div>
<div class="grid">
<section class="card"><h2>Один персонаж</h2><label>Тестовый сценарий</label><select id="singleCase"></select><button id="singleBtn">Запустить тест</button><div id="singleOut"></div></section>
<section class="card"><h2>Два персонажа</h2><label>Тестовый сценарий</label><select id="pairCase"></select><label>Фокус</label><select id="focus"><option value="connection">Они сами</option><option value="bond" selected>Их связь</option><option value="events">То, что с ними происходит</option><option value="conflict">Их конфликт</option></select><button id="pairBtn">Запустить тест</button><div id="pairOut"></div></section>
</div>
<div class="card"><h2>Профиль, который получил алгоритм</h2><p class="meta">Смотрим, какие параметры реально дошли до движка.</p><div id="profileOut">Запустите любой тест.</div></div>

<script src="../js/soundtrack-engine.js"></script>
<script>
const singleEl=document.getElementById('singleCase'),pairEl=document.getElementById('pairCase'),statusEl=document.getElementById('status');
const SOURCE_FILES=['alternative','gothic-industrial','modern-heavy','female-alternative','classic-rock','russian-rock','dark-folk','soundtracks','anime','metal-rock'];
let data=null,music=[],scoring=null;
function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
async function getJson(url){const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error(r.status+' '+url);return await r.json();}
async function load(){
 try{
  if(!window.SoundtrackEngine) throw new Error('Движок не загрузился: ../js/soundtrack-engine.js');
  data=await getJson('./test-cases.json');
  scoring=await getJson('../data/music-scoring.json');
  const loaded=[];
  for(const category of SOURCE_FILES){
   try{const raw=await getJson('../data/music/'+category+'.json');loaded.push((raw.tracks||[]).map(t=>({...t,category,layer:category})));}
   catch(e){throw new Error('Не загрузился музыкальный слой '+category+': '+e.message);}
  }
  music=loaded.flat();
  data.cases.filter(x=>x.type==='single').forEach((x,i)=>singleEl.add(new Option(x.description||x.id,i)));
  data.cases.filter(x=>x.type==='pair').forEach((x,i)=>pairEl.add(new Option(x.description||x.id,i)));
  statusEl.innerHTML='<span class="ok">✓ Загружено '+music.length+' треков · '+SOURCE_FILES.length+' музыкальных слоёв · '+data.cases.length+' тестов · движок подключён</span>';
 }catch(e){statusEl.innerHTML='<span class="warn">⚠ '+esc(e.message)+'</span>';console.error(e);}
}
const signalMap={gothic:['darkness','mystery','loneliness'],melancholy:['melancholy','loneliness','nostalgia'],danger:['danger','drama'],beast:['danger','power','chaos'],dark:['darkness','danger'],energy:['energy','rebellion'],night:['mystery','darkness'],identity:['drama','loneliness','mystery'],water:['mystery','melancholy','freedom'],mystical:['mystery','darkness'],outsider:['loneliness','freedom'],freedom:['freedom','energy'],new-life:['hope','freedom'],spirits:['mystery','darkness'],memory:['nostalgia','melancholy'],investigation:['mystery','drama'],loss:['melancholy','loneliness','drama'],mystery:['mystery','darkness'],nostalgia:['nostalgia','melancholy'],conflict:['drama','danger'],friendship:['hope','tenderness','nostalgia'],trust:['hope','tenderness'],warmth:['tenderness','hope'],loyalty:['tenderness','hope'],tension:['drama','danger'],attraction:['romance','danger'],dependence:['romance','loneliness'],chaos:['chaos','energy'],tenderness:['tenderness','romance'],hope:['hope','energy'],family:['tenderness','nostalgia']};
function sliders(signals=[]){const p={drama:5,romance:3,danger:5,mystery:5,hope:4,loneliness:5,nostalgia:5,chaos:5,power:5,freedom:5,melancholy:5,tenderness:4,rebellion:5,darkness:5,epic:4,energy:5};signals.forEach(s=>(signalMap[s]||[]).forEach(k=>p[k]=Math.min(10,p[k]+2)));return p;}
function character(c,part=0){return {sliders:sliders(c.expectedSignals||[]),storyProfile:sliders(c.expectedSignals||[]),role:part?'character-b':'character-a'};}
function pairCharacters(c){const all=c.expectedSignals||[],mid=Math.ceil(all.length/2);let a=character({expectedSignals:all.slice(0,mid)},0),b=character({expectedSignals:all.slice(mid)},1);if(c.id==='siblings'){a.sliders={...a.sliders,nostalgia:9,tenderness:8};b.sliders={...b.sliders,nostalgia:8,tenderness:7,drama:7};}if(c.id==='enemies-to-allies'){a.sliders={...a.sliders,danger:9,power:8};b.sliders={...b.sliders,danger:8,hope:7,mystery:7};}if(c.id==='friendship'){a.sliders={...a.sliders,hope:9,tenderness:8};b.sliders={...b.sliders,hope:8,tenderness:9};}if(c.id==='romantic-chaos'){a.sliders={...a.sliders,romance:9,chaos:8};b.sliders={...b.sliders,romance:9,chaos:9,tenderness:7};}return [a,b];}
function render(items){return items.map((x,i)=>`<div class="result"><b>${i+1}. ${esc(x.title||'Без названия')}</b> — ${esc(x.artist||'Неизвестный исполнитель')}<div class="score">Итоговый score: ${Number(x.finalScore??x.score).toFixed(2)}</div><div class="meta">Категория: ${esc(x.category||'—')}</div></div>`).join('');}
function showProfile(p,label){document.getElementById('profileOut').innerHTML=`<div class="note"><b>${esc(label)}</b></div><div class="profile">${Object.entries(p).map(([k,v])=>`<span class="pill">${esc(k)} ${Number(v).toFixed(1)}</span>`).join('')}</div>`;}
document.getElementById('singleBtn').onclick=()=>{try{const c=data.cases.filter(x=>x.type==='single')[singleEl.value],r=SoundtrackEngine.generatePersonalSoundtrack(character(c),music,scoring,{limit:5});document.getElementById('singleOut').innerHTML='<h3>Результат</h3>'+render(r.tracks);showProfile(r.targetProfile,'Профиль персонажа: '+c.id);}catch(e){document.getElementById('singleOut').innerHTML='<div class="error">'+esc(e.stack||e.message)+'</div>';}};
document.getElementById('pairBtn').onclick=()=>{try{const c=data.cases.filter(x=>x.type==='pair')[pairEl.value],[a,b]=pairCharacters(c),r=SoundtrackEngine.generateSharedSoundtrack(a,b,music,scoring,{relationshipType:c.relationship,trajectory:c.trajectory,focus:document.getElementById('focus').value,limit:5});document.getElementById('pairOut').innerHTML='<h3>Результат</h3>'+render(r.tracks)+`<div class="meta">Связь: ${esc(r.relationshipType||'—')} · траектория: ${esc(r.trajectory||'—')}</div>`;showProfile(r.targetProfile,'Общий профиль: '+c.id);}catch(e){document.getElementById('pairOut').innerHTML='<div class="error">'+esc(e.stack||e.message)+'</div>';}};
load();
</script>
</body></html>
