<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Soundtrack Engine — Test Lab</title>
<style>
body{font-family:system-ui,sans-serif;max-width:1100px;margin:0 auto;padding:32px;background:#f5f2ed;color:#241f24}h1{margin-bottom:4px}.sub{opacity:.65}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;margin:24px 0}.card{background:white;border:1px solid #ddd6d0;border-radius:16px;padding:20px;box-shadow:0 4px 18px #0000000b}label{display:block;margin:10px 0 4px;font-weight:600}select,input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ccc;border-radius:9px;background:#fff}button{border:0;border-radius:10px;padding:11px 16px;background:#241f24;color:white;cursor:pointer;margin-top:12px}.result{padding:12px 0;border-bottom:1px solid #eee}.score{font-size:.85em;opacity:.65}.error{color:#9b1c31;background:#fff0f2;padding:12px;border-radius:10px}.bar{height:8px;background:#eee;border-radius:9px;overflow:hidden;margin:5px 0 10px}.fill{height:100%;background:#555}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#eee;margin:2px;font-size:.8em}
</style></head>
<body>
<h1>🎧 Soundtrack Engine Test Lab</h1><div class="sub">Внутренняя страница для настройки алгоритма. Ничего не меняет в основном генераторе.</div>
<div class="grid">
<section class="card"><h2>Один персонаж</h2><label>Тестовый сценарий</label><select id="singleCase"></select><button onclick="runSingle()">Запустить тест</button><div id="singleOut"></div></section>
<section class="card"><h2>Два персонажа</h2><label>Тестовый сценарий</label><select id="pairCase"></select><label>Фокус</label><select id="focus"><option value="connection">Они сами</option><option value="bond" selected>Их связь</option><option value="events">То, что с ними происходит</option><option value="conflict">Их конфликт</option></select><button onclick="runPair()">Запустить тест</button><div id="pairOut"></div></section>
</div>
<div class="card"><h2>Сравнение профилей</h2><p>Этот блок показывает, какие эмоциональные параметры получил выбранный сценарий.</p><div id="profileOut">Выберите тест выше.</div></div>
<script src="../js/soundtrack-engine.js"></script>
<script>
let data=null, music=[], rules={};
const singleEl=document.getElementById('singleCase'), pairEl=document.getElementById('pairCase');
function esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
async function load(){
 try{
  const [tc,m,cr,rr]=await Promise.all([fetch('./test-cases.json'),fetch('../data/music.json'),fetch('../data/character-rules.json').catch(()=>null),fetch('../data/relationship-scoring.json')]);
  data=await tc.json(); music=await m.json(); rules=await rr.json();
  if(Array.isArray(music.tracks)) music=music.tracks;
  data.cases.filter(x=>x.type==='single').forEach((x,i)=>singleEl.add(new Option(x.description||x.id,i)));
  data.cases.filter(x=>x.type==='pair').forEach((x,i)=>pairEl.add(new Option(x.description||x.id,i)));
 }catch(e){document.body.insertAdjacentHTML('beforeend','<div class="error">Не удалось загрузить данные: '+esc(e.message)+'</div>')}
}
function render(items,mode){return items.map((x,i)=>{let s=x.song||{};return `<div class="result"><b>${i+1}. ${esc(s.title||s.name||'Без названия')}</b> — ${esc(s.artist||'Неизвестный исполнитель')}<div class="score">Итоговый score: ${(x.adjustedScore??x.score).toFixed(3)} · ${esc(x.explanation||'')}</div></div>`}).join('')}
function showProfile(p){let d=p.dimensions||p;document.getElementById('profileOut').innerHTML=Object.entries(d).map(([k,v])=>`<span class="pill">${esc(k)} ${Number(v).toFixed(1)}</span>`).join('')}
function runSingle(){let c=data.cases.filter(x=>x.type==='single')[singleEl.value];let character={sliders:{}}; (c.expectedSignals||[]).forEach((x,i)=>character.sliders[['drama','mystery','danger','loneliness','nostalgia','energy','freedom','hope'][i%8]]=6+i%5); let out=SoundtrackEngine.generateSingle(music,character,rules.characterRules||rules,5); document.getElementById('singleOut').innerHTML=render(out,'single'); showProfile(SoundtrackEngine.buildCharacterProfile(character,rules.characterRules||rules));}
function runPair(){let c=data.cases.filter(x=>x.type==='pair')[pairEl.value];let a={sliders:{drama:6,energy:5,mystery:6,loneliness:5,hope:5},role:'character-a'},b={sliders:{drama:5,energy:6,mystery:5,loneliness:4,hope:6},role:'character-b'};let out=SoundtrackEngine.generatePair(music,a,b,{relationshipType:c.relationship,trajectory:c.trajectory,focus:document.getElementById('focus').value},rules.characterRules||rules,rules,5);document.getElementById('pairOut').innerHTML=render(out,'pair');showProfile(SoundtrackEngine.buildPairProfile(a,b,{relationshipType:c.relationship,trajectory:c.trajectory},rules));}
load();
</script></body></html>
